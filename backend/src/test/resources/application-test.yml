spring:
  datasource:
    url: jdbc:h2:mem:openclaw_vs_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    api-key-encryption-key: test-encryption-key-32bytes!!

logging:
  level:
    com.openclaw: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
