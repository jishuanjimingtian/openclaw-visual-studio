spring:
  datasource:
    url: jdbc:h2:file:./data/openclaw_vs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  security:
    api-key-encryption-key: ${APP_ENCRYPTION_KEY:openclaw-vs-dev-key}

logging:
  level:
    com.openclaw: DEBUG
    org.springframework.web: INFO
